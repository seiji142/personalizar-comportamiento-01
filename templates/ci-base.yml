name: CI

# Plantilla base del Núcleo (FRAMEWORK): copiar a .github/workflows/ci.yml
# del proyecto adoptado y descomentar el bloque del stack.
# El job `artefactos` (sin dependencias) corre siempre: CI verde día uno.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/*"]

jobs:
  artefactos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ci_checks.py

  # --- Descomentar según el stack (uno solo) ---
